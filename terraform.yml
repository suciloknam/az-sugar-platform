name: Terraform - Phase 0 Infra

on:
  pull_request:
    paths:
      - 'terraform-infra/**'
  push:
    branches: [main]
    paths:
      - 'terraform-infra/**'

permissions:
  id-token: write   # required — this is what lets GitHub mint the OIDC token Azure checks
  contents: read
  pull-requests: write

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true
  TF_VAR_entra_admin_object_id: ${{ secrets.ENTRA_ADMIN_OBJECT_ID }}
  TF_VAR_entra_admin_login: ${{ secrets.ENTRA_ADMIN_LOGIN }}

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    environment: prod   # ties this run to the federated credential's subject claim
    defaults:
      run:
        working-directory: terraform-infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=social-platform.tfstate"

      - name: Terraform Plan
        run: terraform plan -out=tfplan -no-color

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform-infra/tfplan

  apply:
    name: Terraform Apply
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: prod   # add required reviewers on this GitHub environment for a human approval gate
    defaults:
      run:
        working-directory: terraform-infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=social-platform.tfstate"

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false
